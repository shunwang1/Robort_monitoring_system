robotdata:
  tcp:
    worker-thread-pool-size: 5
    acceptor-thread-pool-size: 1


mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #mybatis后台log
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.iua.caas.robotdatahub.Entity

logging:
  level:
    root: info  # 根日志级别
    cn/iua/caas/robotdatahub: debug  # 你的包路径设置为debug级别
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: root/logs/application.log   # 日志文件路径
  logback:
    rollingpolicy:
      max-file-size: 10MB  # 单个日志文件最大大小
      max-history: 30


